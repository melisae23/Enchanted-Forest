<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Birthday Garden for Sam</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#07130f;--green:#10251b;--gold:#e6c77a;--cream:#f4ead5;--ink:#4c3b2b}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--cream);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.screen{min-height:100svh;display:none;position:relative;overflow:hidden;padding:32px 18px}
.screen.active{display:flex;align-items:center;justify-content:center}
#entrance {
  background:
    linear-gradient(
      rgba(7, 19, 15, 0.45),
      rgba(7, 19, 15, 0.65)
    ),
    url("https://i.pinimg.com/736x/cb/69/9f/cb699f579ed42eb4ecb4c171431beaca.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.panel{text-align:center;max-width:560px;width:100%;position:relative;z-index:2}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-size:.72rem}
h1,h2{font-weight:400}
h1{font-size:clamp(2.1rem,7vw,4.2rem);line-height:1.05;margin:.45em 0}
p{line-height:1.7;color:#d7d2c2}
input[type=text]{background:#f5eddd;border:1px solid #c9b887;border-radius:999px;padding:14px 18px;width:min(280px,100%);text-align:center;color:#25372b;letter-spacing:.12em}
.btn{border:1px solid #c9a95e;color:#f8edcf;background:linear-gradient(135deg,#38543c,#172d20);padding:12px 23px;border-radius:999px;margin:10px 5px;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px #d8bb6a55}
.muted{font-size:.88rem;color:#a9b5a7}
.error{min-height:1.5em;color:#f0bb9d;font-size:.9rem}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe7a0;box-shadow:0 0 12px 4px #e9cf76aa;animation:drift 6s ease-in-out infinite alternate;opacity:.8}
@keyframes drift{to{transform:translate(25px,-38px);opacity:.25}}
#blackScreen{background:#000;display:none}
#blackScreen.active{display:flex}
#cakeScreen {
  background:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.45)),
    url("Ai forest.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  flex-direction: column;
  text-align: center;
  gap: 4px;
}
.cake-stage{position:relative;width:min(440px,94vw);height:340px;margin:0 auto;display:flex;align-items:flex-end;justify-content:center;opacity:0;transform:translateY(18px);transition:opacity 2.8s,transform 2.8s}
.cake-stage.show{opacity:1;transform:none}
.countdown-behind{position:absolute;z-index:0;top:22px;left:0;width:100%;font-size:clamp(4rem,18vw,7rem);line-height:1;color:#f4d98c;opacity:0;text-shadow:0 0 28px #e6c77a99;transition:opacity .35s}
.countdown-behind.show{opacity:.5}

/* STACKED BIRTHDAY CAKE */

.stack-cake {
  position: relative;
  width: 300px;
  height: 230px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 2;
}

.cake-layer {
  position: absolute;
  height: 60px;
  margin: auto;
  left: 0;
  right: 0;
  border-radius: 12px 12px 8px 8px;
  background:
    linear-gradient(
      transparent 38px,
      #e3a953 38px,
      #e3a953 47px,
      transparent 47px
    ),
    radial-gradient(circle at 30px 5px, #713e16 30px, #eac284 31px);
  background-size: 100% 100%, 60px 100px;
  background-position: 28px 0;
  opacity: 0;
  transform: translateY(35px);
}

.bottom-layer {
  width: 240px;
  bottom: 0;
}

.middle-layer {
  width: 204px;
  bottom: 55px;
}

.top-layer {
  width: 168px;
  bottom: 110px;
}

/* Layers rise one after another */

.cake-stage.show .bottom-layer {
  animation: layerRise 1.2s ease forwards;
}

.cake-stage.show .middle-layer {
  animation: layerRise 1.2s 1s ease forwards;
}

.cake-stage.show .top-layer {
  animation: layerRise 1.2s 2s ease forwards;
}

@keyframes layerRise {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}



/* SINGLE CANDLE ON TOP OF THE CAKE */

.new-candle {
  position: absolute;
  width: 8px;
  height: 34px;
  left: 50%;
  bottom: 60px;
  margin-left: -4px;

  border-radius: 3px 3px 1px 1px;

  background: repeating-linear-gradient(
    45deg,
    #fd3018 0,
    #fd3018 5px,
    #ffa89e 5px,
    #ffa89e 10px
  );

  opacity: 0;
  transform: translateY(12px);
  z-index: 10;
}

.cake-stage.show .new-candle {
  animation: candleRise .8s 1.2s ease forwards;
}

@keyframes candleRise {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* FLAME */

.new-candle::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 18px;
  left: -2px;
  bottom: 30px;

  background: radial-gradient(
    ellipse at 50% 70%,
    #fffbd1 0 15%,
    #ffe66b 35%,
    #ffad32 65%,
    #f36b20 85%
  );

  border-radius: 60% 40% 60% 40%;
  transform: scale(0);
  transform-origin: bottom center;

  filter: drop-shadow(0 0 7px #ffc75c);
}

.cake-stage.show .new-candle::after {
  animation:
    new-flame-appear .5s 2s forwards,
    new-flame-flicker .18s 2.5s infinite alternate;
}

@keyframes new-flame-appear {
  to {
    transform: scale(1);
  }
}

@keyframes new-flame-flicker {
  to {
    filter: drop-shadow(0 0 12px #ffb52e);
    opacity: .8;
  }
}

/* EXTINGUISH FLAME */

.cake-stage.show .new-candle.blown::after {
  animation: new-flame-out .4s forwards;
}

@keyframes new-flame-out {
  to {
    opacity: 0;
    transform: scale(0);
    filter: none;
  }
}


.cake-title{
  font-family: 'Dancing Script', cursive;
  opacity:0;
  transition:opacity 1.4s;
  font-size:clamp(1.8rem,6vw,3.3rem);
  color:#f6df9e;
  text-shadow:0 0 18px #d7b66b66;
  margin:.25em 0;
}
.cake-title.show{opacity:1;animation:titleFloat 3.2s ease-in-out infinite}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#countdown{display:none}
#wishText{margin:0;min-height:1.5em}
#afterBlow{display:none}
#cakeGuide{
  min-height:1.8em;
  margin:2px 16px 0;
  color:#f4ead5;
  font-size:clamp(1rem,3.8vw,1.25rem);
  letter-spacing:.04em;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .7s ease, transform .7s ease;
  text-shadow:0 0 12px #e6c77a55;
}
#cakeGuide.show{opacity:1;transform:translateY(0)}
.confetti-piece{position:fixed;top:-18px;width:9px;height:14px;z-index:30;pointer-events:none;animation:confettiFall var(--fall) linear forwards;opacity:.95}
@keyframes confettiFall{to{transform:translate3d(var(--drift),110vh,0) rotate(780deg);opacity:.9}}
#envelopeLaunch{position:absolute;right:clamp(16px,5vw,58px);bottom:clamp(22px,6vh,55px);width:76px;height:76px;border:0;background:transparent;padding:0;display:none;z-index:12;filter:drop-shadow(0 8px 12px #0009);animation:float 3s ease-in-out infinite}
#envelopeLaunch.show{display:block}
#envelopeLaunch img{width:100%;height:100%;object-fit:contain}
#envelopeLaunch .notif-dot{position:absolute;right:3px;top:2px;width:13px;height:13px;border-radius:50%;background:#e43d3d;border:2px solid #fff0d6;box-shadow:0 0 9px #f33}
.envelope{font-size:6rem;filter:drop-shadow(0 0 18px #d7b66b55);animation:float 3s ease-in-out infinite}
#backToGarden{margin-top:12px}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes unfold{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}
.letter h2{color:#745638}
footer{font-size:.75rem;color:#a5b09e;margin-top:20px}
@media(max-width:480px){#envelopeLaunch{width:62px;height:62px;right:18px;bottom:18px}.cake-stage{height:290px}.cake{width:235px}.cake:before{width:249px}}

#mailReveal {
  background:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.45)),
    url("Ai forest.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  flex-direction: column;
  text-align: center;
  gap: 18px;
}
.heart-loader{font-size:4.5rem;color:#e99aa9;filter:drop-shadow(0 0 18px #e99aa988);animation:heartSpin 1.15s linear infinite}
@keyframes heartSpin{to{transform:rotate(360deg) scale(1.06)}}
#heartMessage{color:#f1dfbd;letter-spacing:.08em}
#singleLetter{display:none;width:min(330px,82vw);min-height:190px;border:1px solid #d6bd83;border-radius:4px;background:linear-gradient(145deg,#fff4dd,#e7d1a7);color:#73583b;box-shadow:0 16px 38px #0009;padding:24px 18px;cursor:pointer;transform:translateY(28px) scale(.75);opacity:0}
#singleLetter.pop{display:block;animation:letterPop .75s cubic-bezier(.2,.85,.25,1.2) forwards}
@keyframes letterPop{to{transform:translateY(0) scale(1);opacity:1}}
#singleLetter .letter-icon{font-size:2.5rem;display:block;margin-bottom:12px}
#singleLetter strong{display:block;font-size:1.35rem;font-weight:400}
#singleLetter small{display:block;margin-top:10px;color:#987447}
#letterModal{position:fixed;inset:0;background:#020805eF;display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
#letterModal.open{display:flex}
.letter{max-width:560px;width:100%;min-height:300px;background:linear-gradient(145deg,#fff5df,#e7d3ac);color:var(--ink);padding:35px 28px;box-shadow:0 15px 55px #000b;position:relative;animation:unfold .65s ease;text-align:left}
#personalMessage{white-space:pre-wrap;line-height:1.8;color:#594832;font-size:1rem}
#closeLetter{position:absolute;right:14px;top:10px;border:0;background:none;color:#71583c;font-size:1.5rem}


/* ALIGNMENT FIX: keep the cake centered, with the wish text underneath */
#cakeScreen.active {
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#cakeScreen .cake-stage {
  width: min(560px, 94vw);
  height: auto;
  min-height: 330px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  padding-top: 72px;
}

#cakeScreen .stack-cake {
  flex: 0 0 230px;
  margin: 0 auto;
}

#cakeScreen #wishText,
#cakeScreen #afterBlow {
  position: relative;
  z-index: 3;
  width: 100%;
  text-align: center;
  margin: 12px 0 0;
}

#cakeScreen #afterBlow {
  margin-top: 2px;
}

/* Keep the wish lines hidden until their turn in the reveal. */
#cakeScreen #wishText,
#cakeScreen #afterBlow {
  display: none;
}

/* Envelope stays at the lower-right corner of the cake screen. */
#cakeScreen #envelopeLaunch {
  right: clamp(18px, 3vw, 42px);
  top: auto;
  bottom: clamp(18px, 3vh, 30px);
}

/* Persistent sound control: visible on every screen, including the entrance. */
#audioControls {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 11px;
  border: 1px solid #c9a95e88;
  border-radius: 999px;
  background: rgba(7, 19, 15, .78);
  backdrop-filter: blur(8px);
  box-shadow: 0 5px 18px #0005;
}
#audioToggle {
  border: 0;
  background: transparent;
  color: #f6df9e;
  font-size: 1.25rem;
  line-height: 1;
  padding: 3px;
  cursor: pointer;
}
#audioVolume {
  width: 92px;
  accent-color: #e6c77a;
  cursor: pointer;
}
@media (max-width: 480px) {
  #audioControls { top: 12px; right: 12px; padding: 7px 9px; }
  #audioVolume { width: 76px; }
}

@media (max-width: 480px) {
  #cakeScreen .cake-stage {
    width: 94vw;
    min-height: 310px;
    padding-top: 62px;
  }

  #cakeScreen .stack-cake {
    transform: scale(.86);
    transform-origin: top center;
    margin-bottom: -32px;
  }

  #cakeScreen #envelopeLaunch {
    width: 58px;
    height: 58px;
    right: 18px;
    top: auto;
    bottom: 18px;
  }
}


/* Final interaction and positioning refinements */
#envelopeLaunch {
  position: fixed !important;
  right: max(10px, env(safe-area-inset-right)) !important;
  bottom: max(10px, env(safe-area-inset-bottom)) !important;
  top: auto !important;
  left: auto !important;
  width: 82px;
  height: 82px;
  z-index: 120 !important;
}
@media (max-width: 480px) {
  #envelopeLaunch {
    width: 68px;
    height: 68px;
    right: max(8px, env(safe-area-inset-right)) !important;
    bottom: max(8px, env(safe-area-inset-bottom)) !important;
  }
}
#cakeScreen #wishText, #cakeScreen #afterBlow { display:none !important; }

#mailReveal { gap: 20px; }
#heartLoader { margin: 0 0 8px; }
#singleLetter {
  display: none;
  width: min(260px, 66vw);
  height: min(260px, 66vw);
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
  border-radius: 0;
  opacity: 0;
  transform: translateY(24px) scale(.72);
  cursor: pointer;
}
#singleLetter.pop {
  display: block;
  animation: letterPop .75s cubic-bezier(.2,.85,.25,1.2) forwards;
}
#singleLetter img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 10px 18px #0006);
}

#letterModal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: hidden;
  background: rgba(2, 8, 5, .72);
  z-index: 150;
}
#letterModal.open { display: flex; }
.paper-flight {
  position:absolute;
  right:18px;
  bottom:18px;
  width:76px;
  height:76px;
  opacity:0;
  z-index:2;
  pointer-events:none;
  transform:translate(0,0) rotate(-8deg) scale(.35);
}
/* Folded origami airplane: pointed nose, two paper wings, and a visible center crease. */
.paper-flight::before{
  content:"";
  position:absolute;
  inset:5px 3px 7px 3px;
  background:linear-gradient(145deg,#ffffff 0 46%,#e8edf1 47% 100%);
  clip-path:polygon(0 36%,100% 0,63% 100%,47% 59%);
  filter:drop-shadow(0 5px 5px #0004);
}
.paper-flight::after{
  content:"";
  position:absolute;
  left:38%;top:31%;width:53%;height:1.5px;
  background:#b9c4ce;
  transform:rotate(-25deg);
  transform-origin:left center;
  box-shadow:0 1px 0 #ffffffaa;
}
#letterModal.travel .paper-flight {
  animation:paperFly 1.05s cubic-bezier(.2,.75,.2,1) forwards;
}
@keyframes paperFly {
  0% {opacity:0;transform:translate(0,0) rotate(-8deg) scale(.35)}
  12% {opacity:1}
  100% {opacity:1;transform:translate(calc(-50vw + 50%),calc(-50vh + 50%)) rotate(0) scale(1.15)}
}
.letter-paper {
  position: relative;
  width: min(570px, 92vw);
  max-height: min(78vh, 760px);
  min-height: 330px;
  overflow-y: auto;
  padding: 54px 34px 36px;
  background: #fffefa;
  color: #493f36;
  box-shadow: 0 20px 65px #0008;
  border: 1px solid #e8e1d7;
  opacity: 0;
  transform: perspective(900px) rotateX(78deg) scale(.65);
  transform-origin: center center;
  z-index: 3;
}
#letterModal.opened .letter-paper {
  animation: paperUnfold .85s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes paperUnfold {
  0% { opacity: 0; transform: perspective(900px) rotateX(78deg) scale(.65); }
  55% { opacity: 1; transform: perspective(900px) rotateX(-8deg) scale(1.02); }
  100% { opacity: 1; transform: perspective(900px) rotateX(0) scale(1); }
}
#closeLetter {
  position: absolute;
  top: 10px;
  right: 15px;
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  color: #776b60;
  font-size: 2rem;
  line-height: 1;
  cursor: pointer;
}
#personalMessage {
  margin: 0;
  white-space: pre-wrap;
  color: #493f36;
  font: 1rem/1.9 Georgia, 'Times New Roman', serif;
}

</style>
</head>
<body>
<!-- Put your chosen audio file beside this HTML file and name it birthday-song.mp3. -->
<audio id="musicPlayer" src="Green - dept.mp3" loop preload="auto"></audio>
<div id="audioControls" aria-label="Music volume controls">
  <button id="audioToggle" type="button" aria-label="Mute music" title="Mute / unmute">🔊</button>
  <input id="audioVolume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Music volume">
</div>
<section id="entrance" class="screen active">
  <div class="panel">
    <div class="eyebrow">Welcome to the Enchanted Forest</div>
    <h1>The Lights will Guide You</h1>
    <p class="muted">To enter, tell us today's date.</p>
    <input id="birthdayInput" type="text" placeholder="MM/DD" maxlength="5" autocomplete="off">
    <div><button class="btn" id="enterBtn">Enter</button></div>
    <div id="dateError" class="error"></div>
  </div>
</section>

<section id="blackScreen" class="screen" aria-label="A moment in the dark"></section>

<section id="cakeScreen" class="screen">
  <h1 class="cake-title" id="birthdayTitle">Happy Birthday Sam!</h1>
  <div class="cake-stage" id="cakeStage">
  <div class="countdown-behind" id="countdownBehind"></div>

  <div class="stack-cake">
  <div class="cake-layer bottom-layer"></div>
  <div class="cake-layer middle-layer"></div>

  <div class="cake-layer top-layer">
    <div class="new-candle"></div>
  </div>
</div>
  </div>
  <p id="cakeGuide" aria-live="polite"></p>
  <button id="envelopeLaunch" type="button" aria-label="Open birthday messages">
    <img src="ENVELOPE.png" alt="Vintage envelope">
    <span class="notif-dot" aria-hidden="true"></span>
  </button>
</section>

<section id="mailReveal" class="screen">

const PERSONAL_MESSAGE = `Dear Marcher,

Kung nababasa mo ito, tapos na ang quest mo sa Enchanted Forest, hihi. I hope nagbigay itong website ng saya, even just for a moment.

Cher, masasabi kong walang papalit sa'yo. Ikaw lang ang Marcher ko. Simula pa lang, na-appreciate ko na ang way mo ng pag-lead sa amin. Then, after mong lumipat ng component, grabe, first iyak ko talaga yun for my college life. Hindi naman sa ayaw kitang pakawalan, pero ang hirap palang magpaalam sa isang taong naging parte ng buhay mo, kahit saglit pa lang. Despite that, I genuinely support you and whatever path you choose to take.

Happy Birthday, our Marcher Samantha! I hope your day is just as special as you are. We love youuu, our green. 💚

From yours truly,
Cute na iyakin,
Louisa/Louie.`;

const $ = id => document.getElementById(id);
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function addFireflies(parent,count=32){
  for(let i=0;i<count;i++){
    const f=document.createElement('i'); f.className='firefly';
    f.style.left=Math.random()*100+'%'; f.style.top=Math.random()*100+'%';
    f.style.animationDelay=(Math.random()*6)+'s'; f.style.animationDuration=(4+Math.random()*6)+'s';
    parent.appendChild(f);
  }
}
addFireflies($('entrance')); addFireflies($('cakeScreen')); addFireflies($('mailReveal'));

// Music is bundled as a separate file beside this HTML (birthday-song.mp3).
// The volume control is visible from the entrance and stays available on every screen.
const musicPlayer = $('musicPlayer');
const volumeControl = $('audioVolume');
const audioToggle = $('audioToggle');
musicPlayer.volume = Number(volumeControl.value);

function updateSoundButton() {
  const isMuted = musicPlayer.muted || musicPlayer.volume === 0;
  audioToggle.textContent = isMuted ? '🔇' : (musicPlayer.volume < 0.5 ? '🔉' : '🔊');
  audioToggle.setAttribute('aria-label', isMuted ? 'Unmute music' : 'Mute music');
}

volumeControl.addEventListener('input', () => {
  musicPlayer.volume = Number(volumeControl.value);
  musicPlayer.muted = musicPlayer.volume === 0;
  updateSoundButton();
});

audioToggle.addEventListener('click', () => {
  musicPlayer.muted = !musicPlayer.muted;
  if (!musicPlayer.muted && musicPlayer.volume === 0) {
    musicPlayer.volume = 0.5;
    volumeControl.value = '0.5';
  }
  updateSoundButton();
});
updateSoundButton();

  const pieces=90;
  for(let i=0;i<pieces;i++){
    const piece=document.createElement('i');
    piece.className='confetti-piece';
    piece.style.left=Math.random()*100+'vw';
    piece.style.background=['#e6c77a','#f4ead5','#d98b78','#9dbb91','#d9a8bd'][i%5];
    piece.style.setProperty('--drift',`${(Math.random()-.5)*260}px`);
    piece.style.setProperty('--fall',`${3+Math.random()*3}s`);
    piece.style.animationDelay=`${Math.random()*.8}s`;
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),7000);
  }
}

function startBirthdayReveal() {
  const candle = document.querySelector('.new-candle');

  // Reset the cake animation and countdown for the first reveal only.
  $('cakeStage').classList.remove('show');
  $('birthdayTitle').classList.remove('show');
  $('countdownBehind').classList.remove('show');
  $('countdownBehind').textContent = '';
  $('envelopeLaunch').classList.remove('show');
  $('cakeGuide').classList.remove('show');
  $('cakeGuide').textContent = '';
  candle.classList.remove('blown');

  requestAnimationFrame(() => {
    $('cakeStage').classList.add('show');
  });

  // Birthday title appears as the cake is being assembled.
  setTimeout(() => {
    $('birthdayTitle').classList.add('show');
  }, 3300);

  // Let the top layer and candle finish, then wait one second before countdown.
  // The top layer rises at about 3.2 seconds from the start.
  setTimeout(() => {
    $('cakeGuide').textContent = 'Blow the candle';
    $('cakeGuide').classList.add('show');
    let n = 5;
    $('countdownBehind').textContent = n;
    $('countdownBehind').classList.add('show');

    const timer = setInterval(() => {
      n--;
      if (n > 0) {
        $('countdownBehind').textContent = n;
      } else {
        clearInterval(timer);
        $('countdownBehind').textContent = '';
        $('countdownBehind').classList.remove('show');

        candle.classList.add('blown');
        $('cakeGuide').textContent = 'May your year be filled with blessings';
        launchConfetti();

        setTimeout(() => {
          $('envelopeLaunch').classList.add('show');
        }, 700);
      }
    }, 1000);
  }, 4200);
}

$('enterBtn').addEventListener('click',()=>{
  const value=$('birthdayInput').value.trim().replace('-','/');
  if(value!==CORRECT_DATE){
    $('dateError').textContent="That date doesn't seem to unlock this little garden. Try again!";
    return;
  }
  $('dateError').textContent='';
  // Start the song immediately after the correct date is entered, during the black screen.
  musicPlayer.currentTime = 0;
  musicPlayer.play().catch(() => {
    // Some browsers may block playback; the sound button remains available for a retry.
    audioToggle.title = 'Tap to start or unmute music';
  });
  showScreen('blackScreen');
  // Hold on a completely black screen for 3 seconds before the reveal.
  setTimeout(()=>{
    showScreen('cakeScreen');
    startBirthdayReveal();
  },3000);
});

$('birthdayInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('enterBtn').click()});



$('envelopeLaunch').addEventListener('click',()=>{
  showScreen('mailReveal');
  $('heartLoader').style.display='block';
  $('singleLetter').classList.remove('pop');
  $('singleLetter').style.display='none';
  setTimeout(()=>{
    $('heartLoader').style.display='none';
    $('singleLetter').style.display='block';
    requestAnimationFrame(()=>$('singleLetter').classList.add('pop'));
  },7000);
});

$('singleLetter').addEventListener('click',()=>{
  $('personalMessage').textContent=PERSONAL_MESSAGE;
  const modal = $('letterModal');
  modal.classList.remove('opened','travel');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  requestAnimationFrame(() => {
    modal.classList.add('travel');
    setTimeout(() => {
      modal.classList.add('opened');
    }, 950);
  });
});
$('backToCake').addEventListener('click',()=>showScreen('cakeScreen'));
function closeLetterModal() {
  const modal = $('letterModal');
  modal.classList.remove('open','travel','opened');
  modal.setAttribute('aria-hidden','true');
}
$('closeLetter').addEventListener('click', closeLetterModal);
$('letterModal').addEventListener('click',e=>{
  if(e.target===$('letterModal'))closeLetterModal();
});
</script>
